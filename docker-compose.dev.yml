services:
  postgres:
    image: postgres:17
    container_name: onboarder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: onboarder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - onboarder_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onboarder"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak-db:
    image: postgres:17
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    networks:
      - onboarder_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro
    networks:
      - onboarder_net

  migrate:
    image: migrate/migrate:latest
    container_name: onboarder-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@postgres:5432/onboarder?sslmode=disable",
        "up",
      ]
    networks:
      - onboarder_net
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onboarder-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_NAME: keycloak-onboarder
      APP_ENV: development
      APP_PORT: 9000

      DATABASE_URL: postgres://postgres:postgres@postgres:5432/onboarder?sslmode=disable

      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: onboarder
      KEYCLOAK_ADMIN_CLIENT_ID: onboarder-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: onboarder-admin-secret

      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      API_AUTH_TOKEN: A/HhdKZWaaPuL/JiouoKDrf4y0sXdK8u3bfdVQDGkZK2foubw90jEwwP/b3cOStl
    ports:
      - "9000:9000"
    networks:
      - onboarder_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://127.0.0.1:9000/api/v1/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onboarder-ui
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:9000/api/v1
      VITE_API_AUTH_TOKEN: A/HhdKZWaaPuL/JiouoKDrf4y0sXdK8u3bfdVQDGkZK2foubw90jEwwP/b3cOStl
    ports:
      - "3000:5173"
    networks:
      - onboarder_net

volumes:
  postgres_data:
  keycloak_db:
  keycloak_data:

networks:
  onboarder_net:
    driver: bridge
