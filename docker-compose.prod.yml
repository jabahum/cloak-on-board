services:
  postgres:
    image: postgres:17
    container_name: onboarder-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onboarder}
      POSTGRES_USER: ${POSTGRES_USER:-onboarder_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - onboarder_postgres_data:/var/lib/postgresql/data
    networks:
      - onboarder_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-onboarder_user} -d ${POSTGRES_DB:-onboarder}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:latest
    container_name: onboarder-migrate-prod
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER:-onboarder_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-onboarder}?sslmode=disable",
        "up",
      ]
    networks:
      - onboarder_net
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: onboarder-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      APP_PORT: 9000
      DATABASE_URL: postgres://${POSTGRES_USER:-onboarder_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-onboarder}?sslmode=disable
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN}
    expose:
      - "9000"
    networks:
      - onboarder_net
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:9000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_AUTH_TOKEN: ${VITE_API_AUTH_TOKEN}
    container_name: onboarder-ui-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - onboarder_net

  nginx:
    image: nginx:1.27-alpine
    container_name: onboarder-nginx-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/prod.selfsigned.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - ./infrastructure/nginx/certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./infrastructure/nginx/certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    networks:
      - onboarder_net

volumes:
  onboarder_postgres_data:

networks:
  onboarder_net:
    driver: bridge
